    async function callGeminiWithBackoff(payload, retries = 3) {
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(GEMINI_TEXT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    }

    function triggerShoegazeSynthPad(seedIndex = 0) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        const progressions = [
          [174.61, 220.00, 261.63, 329.63],
          [164.81, 196.00, 246.94, 293.66],
          [220.00, 261.63, 329.63, 493.88],
          [130.81, 196.00, 246.94, 329.63]
        ];
        const chord = progressions[seedIndex % progressions.length];

        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const oscDetune = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const gain = audioCtx.createGain();

          osc.type = 'sawtooth';
          oscDetune.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          oscDetune.frequency.setValueAtTime(freq * 1.004, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(950, now);
          filter.frequency.exponentialRampToValueAtTime(1800, now + 1.5);
          filter.frequency.exponentialRampToValueAtTime(700, now + 3.6);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.016, now + 0.6);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

          osc.connect(filter);
          oscDetune.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now + idx * 0.06);
          oscDetune.start(now + idx * 0.06);
          osc.stop(now + 3.9);
          oscDetune.stop(now + 3.9);
        });
      } catch (e) {}
    }

    function stopAllAudio() {
      htmlAudio.pause();
      if (synthInterval) {
        clearInterval(synthInterval);
        synthInterval = null;
      }
    }

    htmlAudio.addEventListener('timeupdate', () => {
      if (!state.nowPlaying.audioUrl) return;
      state.currentTimeSec = Math.floor(htmlAudio.currentTime);
      if (htmlAudio.duration && !isNaN(htmlAudio.duration)) {
        state.nowPlaying.durationSec = Math.floor(htmlAudio.duration);
      }
      renderPlayer();
    });

    htmlAudio.addEventListener('ended', () => {
      state.isPlaying = false;
      state.currentTimeSec = 0;
      renderPlayer();
      refreshActiveViewAudioState();
    });

    htmlAudio.addEventListener('error', () => {
      if (state.isPlaying) {
        showToast('Preview externo no disponible, activando Synth Shoegaze');
        state.nowPlaying.audioUrl = null;
        startSynthPlaybackLoop();
        renderPlayer();
      }
    });

    function startSynthPlaybackLoop() {
      stopAllAudio();
      let chordStep = 0;
      triggerShoegazeSynthPad(chordStep++);
      synthInterval = setInterval(() => {
        state.currentTimeSec += 1;
        if (state.currentTimeSec % 4 === 0) {
          triggerShoegazeSynthPad(chordStep++);
        }
        if (state.currentTimeSec >= state.nowPlaying.durationSec) {
          state.currentTimeSec = 0;
          state.isPlaying = false;
          stopAllAudio();
          refreshActiveViewAudioState();
        }
        renderPlayer();
      }, 1000);
    }

    function startPlayback() {
      const effectiveUrl = localBlobUrls[state.nowPlaying.id] || state.nowPlaying.audioUrl;
      state.isPlaying = true;

      if (effectiveUrl) {
        stopAllAudio();
        if (htmlAudio.src !== effectiveUrl) {
          htmlAudio.src = effectiveUrl;
        }
        htmlAudio.currentTime = state.currentTimeSec || 0;
        htmlAudio.play().catch(() => {
          startSynthPlaybackLoop();
        });
      } else {
        startSynthPlaybackLoop();
      }
      renderPlayer();
      refreshActiveViewAudioState();
    }

    function togglePlayPause() {
      if (state.isPlaying) {
        state.isPlaying = false;
        stopAllAudio();
        renderPlayer();
        refreshActiveViewAudioState();
      } else {
        startPlayback();
      }
    }

    function seekWaveform(event) {
      const container = document.getElementById('waveform-container');
      const rect = container.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      const newSec = Math.floor(ratio * (state.nowPlaying.durationSec || 30));
      state.currentTimeSec = newSec;
      const effectiveUrl = localBlobUrls[state.nowPlaying.id] || state.nowPlaying.audioUrl;
      if (effectiveUrl && !htmlAudio.paused) {
        htmlAudio.currentTime = newSec;
      }
      renderPlayer();
    }

    async function playSceneBandTrack(bandId, trackIndex = 0) {
      const band = state.sceneBands.find(b => b.id === bandId);

          const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=3`);
          if (res.ok) {
            const data = await res.json();
            if (data.results && data.results.length > 0 && data.results[0].previewUrl) {
              trackItem.previewUrl = data.results[0].previewUrl;

              saveState();

      state.nowPlaying = {

        bandId: band.id,

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function renderPlayer() {
      const np = state.nowPlaying;
      if (!np) return;

      document.getElementById('player-title').textContent = np.title;
      document.getElementById('player-artist').textContent = `${np.artist} · ${np.subtitle}`;
      document.getElementById('player-time').textContent = `${formatTime(state.currentTimeSec)} / ${formatTime(np.durationSec || 30)}`;

      const badge = document.getElementById('player-source-badge');
      const hasRealAudio = Boolean(localBlobUrls[np.id] || np.audioUrl);
      if (hasRealAudio) {
        badge.textContent = np.isExternal ? 'Audio Real' : 'MP3/WAV';
        badge.className = 'text-[9px] font-mono px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0';
      } else {
        badge.textContent = 'Synth Pad';
        badge.className = 'text-[9px] font-mono px-1.5 py-0.2 rounded bg-shoegazeViolet/20 text-softViolet border border-shoegazeViolet/30 shrink-0';
      }

      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      if (state.isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      }

      const wfContainer = document.getElementById('waveform-container');
      const progressRatio = state.currentTimeSec / (np.durationSec || 30);
      const bars = np.waveform || [];
      wfContainer.innerHTML = bars.map((val, idx) => {
        const barRatio = idx / bars.length;
        const isPlayed = barRatio <= progressRatio;
        return `
          <div class="flex-1 rounded-full transition-all duration-150 ${
            isPlayed
              ? 'bg-gradient-to-t from-scOrange to-shoegazeViolet'
              : 'bg-white/15 group-hover:bg-white/30'
          }" style="height: ${Math.max(18, val)}%"></div>
        `;
      }).join('');

      const commentBox = document.getElementById('active-timed-comment');
      const actionBtn = document.getElementById('player-action-btn');

      if (np.isExternal && np.bandId) {
        commentBox.innerHTML = `📡 <span class="text-scOrange font-mono">RADAR</span> Escuchando proyecto de la escena: <strong class="text-white">${np.artist}</strong>`;
        actionBtn.innerHTML = `Ver Ficha →`;
        actionBtn.onclick = () => openBandDetailModal(np.bandId);
      } else {
        const bandTrack = state.tracks.find(t => t.id === np.id);
        if (bandTrack && bandTrack.comments && bandTrack.comments.length > 0) {
          const closest = bandTrack.comments.reduce((prev, curr) =>
            Math.abs(curr.sec - state.currentTimeSec) < Math.abs(prev.sec - state.currentTimeSec) ? curr : prev
          );
          commentBox.innerHTML = `💬 <span class="text-scOrange font-mono">${formatTime(closest.sec)}</span> <strong class="text-white">${closest.author}:</strong> "${closest.text}"`;
        } else {
          commentBox.innerHTML = `💬 Toca "+ Nota" para guardar apuntes de mezcla en este segundo.`;
        }
        actionBtn.innerHTML = `+ Nota en <span id="comment-sec-btn" class="font-mono">${formatTime(state.currentTimeSec)}</span>`;
        actionBtn.onclick = () => openAddCommentModal();
      }
    }

    async function syncRadarLive(customQuery = '') {
      if (state.isSyncingRadar) return;
      state.isSyncingRadar = true;
      renderRadarTab();

      const todayStr = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
      const searchTopic = customQuery.trim()
        ? `proyectos musicales o bandas independientes relacionadas con "${customQuery}" en español (dream pop, shoegaze, indie rock, post-punk)`
        : `nuevas bandas y proyectos emergentes poco conocidos de dream pop, shoegaze, noise pop e indie rock en español de México, Argentina, Chile, España o Latinoamérica`;

      showToast(customQuery ? `🔎 Buscando "${customQuery}" en la escena...` : '📡 Sincronizando Radar en vivo con la escena...');

      try {
        const payload = {
          contents: [{
            parts: [{
              text: `Actúa como curadora experta de música underground en español. Busca en internet ${searchTopic}. Devuelve exactamente 4 bandas o proyectos reales independientes (evita bandas mainstream masivas). Para cada proyecto devuelve JSON estricto con: name, city, formedYear, genre (solo uno de: "Dream Pop", "Shoegaze", "Indie Rock", "Post-Punk"), bio (2 oraciones), gearAndVibe (pedales, guitarras o atmósfera sonora), references (2 o 3 bandas afines), collabTip (cómo puede colaborar una banda indie con ellos), y songTitle (una canción real conocida de esa banda).`
            }]
          }],
          tools: [{ google_search: {} }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  name: { type: "STRING" },
                  city: { type: "STRING" },
                  formedYear: { type: "STRING" },
                  genre: { type: "STRING" },
                  bio: { type: "STRING" },
                  gearAndVibe: { type: "STRING" },
                  references: { type: "STRING" },
                  collabTip: { type: "STRING" },
                  songTitle: { type: "STRING" }
                },
                required: ["name", "city", "genre", "bio", "gearAndVibe", "references", "collabTip", "songTitle"]
              }
            }
          }
        };

        const geminiRes = await callGeminiWithBackoff(payload);
        const rawText = geminiRes?.candidates?.[0]?.content?.parts?.[0]?.text;
        let discovered = [];
        if (rawText) {
          discovered = JSON.parse(rawText);
        }

        for (const item of discovered) {
          const exists = state.sceneBands.some(b => b.name.toLowerCase() === item.name.toLowerCase());
          let tracksList = [{ title: item.songTitle || 'Sencillo Destacado', album: item.genre, durationSec: 30, previewUrl: null }];

          try {
            const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(item.name)}&entity=song&limit=3`);
            if (itunesRes.ok) {
              const itunesData = await itunesRes.json();
              if (itunesData.results && itunesData.results.length > 0) {
                tracksList = itunesData.results.map(r => ({
                  title: r.trackName,
                  album: r.collectionName || item.genre,
                  durationSec: 30,
                  previewUrl: r.previewUrl || null
                }));
              }
            }
          } catch (err) {}

          if (!exists) {
            state.sceneBands.unshift({
              id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
              name: item.name,
              city: item.city || 'Escena Hispanoamericana',
              formedYear: item.formedYear || 'Reciente',
              genre: ['Dream Pop', 'Shoegaze', 'Indie Rock', 'Post-Punk'].includes(item.genre) ? item.genre : 'Dream Pop',
              bio: item.bio,
              gearAndVibe: item.gearAndVibe,
              references: item.references,
              collabTip: item.collabTip,
              tracks: tracksList,
              waveform: Array.from({ length: 16 }, () => Math.floor(25 + Math.random() * 70)),
              aiInsight: '',
              isNewToday: true
            });
          } else {
            const existingBand = state.sceneBands.find(b => b.name.toLowerCase() === item.name.toLowerCase());
            if (existingBand && tracksList[0]?.previewUrl) {
              existingBand.tracks = tracksList;
            }
          }
        }

        state.lastSyncDate = `Hoy (${todayStr}) · En vivo`;
        showToast(`✨ Radar actualizado con ${discovered.length} proyectos en vivo`);
      } catch (error) {
        try {
          const fallbackTerm = customQuery.trim() || 'shoegaze dream pop español';
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(fallbackTerm)}&entity=song&limit=8`);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            const grouped = {};
            data.results.forEach(r => {
              if (!grouped[r.artistName]) {
                grouped[r.artistName] = {
                  id: 'r_it_' + r.artistId,
                  name: r.artistName,
                  city: r.country || 'Escena Internacional / Latam',
                  formedYear: r.releaseDate ? r.releaseDate.slice(0, 4) : 'Indie',
                  genre: 'Dream Pop',
                  bio: `Proyecto independiente descubierto en vivo en el catálogo digital. Destaca dentro de la corriente ${r.primaryGenreName || 'alternativa'}.`,
                  gearAndVibe: 'Texturas atmosféricas, guitarras con modulación y producción independiente.',
                  references: 'Escena Dream Pop & Shoegaze',
                  collabTip: 'Escucha sus cortes disponibles y analiza su estructura de producción.',
                  tracks: [],
                  waveform: Array.from({ length: 16 }, () => Math.floor(25 + Math.random() * 70)),
                  aiInsight: '',
                  isNewToday: true
                };
              }
              grouped[r.artistName].tracks.push({
                title: r.trackName,
                album: r.collectionName || 'Sencillo',
                durationSec: 30,
                previewUrl: r.previewUrl
              });
            });

            Object.values(grouped).forEach(newBand => {
              if (!state.sceneBands.some(b => b.name.toLowerCase() === newBand.name.toLowerCase())) {
                state.sceneBands.unshift(newBand);
              }
            });
            state.lastSyncDate = `Hoy (${todayStr}) · Catálogo iTunes`;
            showToast('🎧 Proyectos cargados desde catálogo musical en vivo');
          }
        } catch (fallbackErr) {
          showToast('⚠️ Modo offline activo: mostrando radar guardado');
        }
      } finally {
        state.isSyncingRadar = false;
        saveState();
        if (state.activeTab === 'radar') renderRadarTab();
      }
    }

              text: `Eres la Directora de Marketing y A&R de "${state.band.name}", una banda de ${state.band.genres.join(', ')} ubicada en ${state.band.city}. Analiza el proyecto "${band.name}" (${band.city}, género: ${band.genre}, sonido: ${band.gearAndVibe}). En máximo 3 viñetas cortas y accionables en español dinos: 1) Qué podemos aprender de su estética o sonido, 2) Cómo conectar con ellos (pitch para fecha compartida o playlist), 3) Una idea de contenido cruzado.`
            }]
          }],
          tools: [{ google_search: {} }]
        };

        const res = await callGeminiWithBackoff(payload);
        const text = res?.candidates?.[0]?.content?.parts?.[0]?.text || 'No se pudo obtener respuesta en este momento.';
        band.aiInsight = text;
        saveState();
        if (outputBox) {
          outputBox.innerHTML = formatSimpleMarkdown(text);
          outputBox.classList.remove('hidden');
        }
        showToast('✨ Estrategia generada por tu Directora de Marketing');
      } catch (e) {
        const fallbackInsight = `• **Sonido & Estética:** Toma referencia de su manejo de dinámicas (${band.gearAndVibe}) para contrastar tus pasajes más suaves con explosiones de fuzz.\n• **Conexión Directa:** Escríbeles por Instagram compartiendo un link privado de SoundCloud de "${state.tracks[0]?.title || 'tu demo'}" proponiendo abrir su próxima fecha en ${state.band.city}.\n• **Contenido Cruzado:** Graba un Reel tocando un fragmento de "${band.tracks[0]?.title || 'su tema'}" etiquetándolos.`;
        band.aiInsight = fallbackInsight;
        saveState();
        if (outputBox) {
          outputBox.innerHTML = formatSimpleMarkdown(fallbackInsight);
          outputBox.classList.remove('hidden');
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `✨ Actualizar análisis estratégico`;
        }
      }
    }

    async function generateMarketingIdeaWithAI() {
      if (state.isGeneratingIdea) return;
      state.isGeneratingIdea = true;
      renderMarketingTab();

      const track = state.tracks[0] || { title: 'Nuevo Sencillo', genre: 'Dream Pop' };
      const targetFormat = state.marketingFilter !== 'Todos' ? state.marketingFilter : 'Reels / TikTok';

      try {
        const payload = {
          contents: [{
            parts: [{
              text: `Eres la Directora de Marketing de "${state.band.name}", banda de ${state.band.genres.join(', ')} en ${state.band.city}. Crea una idea fresca y viral de contenido en formato "${targetFormat}" para promocionar nuestra canción "${track.title}". Devuelve JSON con: title, hook (gancho visual o frase inicial), copy (caption con hashtags de nicho shoegaze/dream pop en español).`
            }]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                title: { type: "STRING" },
                hook: { type: "STRING" },
                copy: { type: "STRING" }
              },
              required: ["title", "hook", "copy"]
            }
          }
        };

        const res = await callGeminiWithBackoff(payload);
        const parsed = JSON.parse(res.candidates[0].content.parts[0].text);
        state.savedIdeas.unshift({
          id: 'm_' + Date.now(),
          format: targetFormat,
          title: parsed.title,
          hook: parsed.hook,
          audio: `${track.title} (${track.genre})`,
          copy: parsed.copy,
          status: 'Por grabar'
        });
        showToast('✨ Nueva estrategia creada por tu Directora de Marketing');
      } catch (e) {
        state.savedIdeas.unshift({
          id: 'm_' + Date.now(),
          format: targetFormat,
          title: `Guitarra limpia vs. Muro de Reverb en "${track.title}"`,
          hook: '“El secreto detrás de nuestras atmósferas nocturnas en 15 segundos…”',
          audio: `${track.title}`,
          copy: `Sube el volumen y ponte audífonos 🌌🎸 #ShoegazeEnEspañol #DreamPop #IndieLatino`,
          status: 'Por grabar'
        });
        showToast('✨ Idea agregada al plan de contenido');
      } finally {
        state.isGeneratingIdea = false;
        saveState();
        renderMarketingTab();
      }
    }

    function cycleIdeaStatus(id) {

      idea.status = order[(order.indexOf(idea.status) + 1) % order.length];
      saveState();
      renderMarketingTab();

      state.savedIdeas = state.savedIdeas.filter(i => i.id !== id);

    async function openBandDetailModal(bandId) {
      const band = state.sceneBands.find(b => b.id === bandId);
      if (!band) return;

      const isSaved = state.savedRadarIds.includes(band.id);
      const qEncoded = encodeURIComponent(band.name);

      renderBandDetailModalContent(band, isSaved, qEncoded);

      const needsFetch = !band.tracks || band.tracks.length === 0 || !band.tracks[0].previewUrl;
      if (needsFetch) {
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(band.searchQuery || band.name)}&entity=song&limit=4`);
          if (res.ok) {
            const data = await res.json();
            if (data.results && data.results.length > 0) {
              band.tracks = data.results.map(r => ({
                title: r.trackName,
                album: r.collectionName || band.genre,
                durationSec: 30,
                previewUrl: r.previewUrl || null
              }));
              saveState();
              const backdrop = document.getElementById('modal-backdrop');
              if (!backdrop.classList.contains('hidden')) {
                renderBandDetailModalContent(band, state.savedRadarIds.includes(band.id), qEncoded);
              }
            }
          }
        } catch (e) {}
      }
    }

    function moveSetlistItem(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= state.setlist.length) return;
      const temp = state.setlist[index];
      state.setlist[index] = state.setlist[target];
      state.setlist[target] = temp;
      saveState();
      renderAgendaTab();
    }

    function addBandTask(e) {
      e.preventDefault();
      const input = document.getElementById('new-task-input');
      const text = input.value.trim();
      if (!text) return;
      state.tasks.unshift({ id: 'tk_' + Date.now(), text, done: false });
      input.value = '';
      saveState();
      renderAgendaTab();
      showToast('Tarea agregada');
    }

    function toggleBandTask(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) {
        t.done = !t.done;
        saveState();
        renderAgendaTab();
      }
    }

    function deleteBandTask(id) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      saveState();
      renderAgendaTab();
    }

    function deleteEvent(id) {
      state.events = state.events.filter(x => x.id !== id);
      saveState();
      renderAgendaTab();
      showToast('Evento eliminado');
    }

          <div>
            <label class="block text-zinc-300 mb-1">Notas de mezcla, reverb y cadena de pedales</label>
            <textarea id="trk-notes" rows="2" placeholder="Ej. Guitarra con chorus + reverse reverb al 60%..." class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white"></textarea>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-scOrange text-white font-bold">
            Publicar en Estudio
          </button>
        </form>
      `);
    }

    function submitNewTrack(e) {
      e.preventDefault();
      const fileInput = document.getElementById('trk-file');
      const title = document.getElementById('trk-title').value.trim();
      const version = document.getElementById('trk-version').value.trim();
      const genre = document.getElementById('trk-genre').value;
      const status = document.getElementById('trk-status').value;
      const notes = document.getElementById('trk-notes').value.trim() || 'Mezcla atmosférica en progreso.';

      const trackId = 't_' + Date.now();
      let blobUrl = null;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        blobUrl = URL.createObjectURL(fileInput.files[0]);
        localBlobUrls[trackId] = blobUrl;
      }

      const randomWave = Array.from({ length: 32 }, (_, i) => {
        const envelope = Math.sin((i / 31) * Math.PI);
        return Math.floor(20 + envelope * 65 + Math.random() * 18);
      });

      const newTrack = {
        id: trackId,
        title,
        version,
        status,
        genre,
        durationSec: 180,
        plays: 1,
        audioUrl: blobUrl,
        notes,
        waveform: randomWave,
        comments: [{ sec: 10, author: state.band.name, text: 'Primera subida al estudio.' }]
      };

      state.tracks.unshift(newTrack);
      saveState();
      selectBandTrack(trackId);
      closeModal();
      showToast(blobUrl ? '🎧 Audio real cargado en el reproductor' : '🎛️ Pista agregada al estudio');
    }

    function openAddCommentModal() {
      const bandTrack = state.tracks.find(t => t.id === state.nowPlaying.id);
      if (!bandTrack) return;
      const sec = state.currentTimeSec;
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-serif text-xl font-bold text-white">Nota en <span class="text-scOrange font-mono">${formatTime(sec)}</span></h3>
          <button onclick="closeModal()" class="text-zinc-400 hover:text-white">✕</button>
        </div>
        <p class="text-[11px] text-zinc-400">Pista: <strong>${bandTrack.title}</strong></p>
        <form onsubmit="submitTimedComment(event, ${sec})" class="space-y-3 text-xs">
          <div>
            <label class="block text-zinc-300 mb-1">Autor / Rol</label>
            <input id="cmt-author" required value="Producción / Banda" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <div>
            <label class="block text-zinc-300 mb-1">Comentario de mezcla o idea de marketing</label>
            <input id="cmt-text" required placeholder="Ej. Subir delay en este coro" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-scOrange text-white font-bold">
            Fijar Nota en ${formatTime(sec)}
          </button>
        </form>
      `);
    }

    function submitTimedComment(e, sec) {
      e.preventDefault();
      const track = state.tracks.find(t => t.id === state.nowPlaying.id);
      if (!track) return;
      const author = document.getElementById('cmt-author').value.trim();
      const text = document.getElementById('cmt-text').value.trim();
      if (!track.comments) track.comments = [];
      track.comments.push({ sec, author, text });
      saveState();
      renderPlayer();
      if (state.activeTab === 'studio') renderStudioTab();
      closeModal();
      showToast(`💬 Nota fijada en ${formatTime(sec)}`);
    }

    function openAddEventModal() {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-serif text-xl font-bold text-white">Nuevo Evento en Agenda</h3>
          <button onclick="closeModal()" class="text-zinc-400 hover:text-white">✕</button>
        </div>
        <form onsubmit="submitNewEvent(event)" class="space-y-3 text-xs">
          <div>
            <label class="block text-zinc-300 mb-1">Título del evento</label>
            <input id="ev-title" required placeholder="Ej. Sesión de fotos analógicas" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-zinc-300 mb-1">Fecha</label>
              <input id="ev-date" type="date" required value="2026-12-05" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
            </div>
            <div>
              <label class="block text-zinc-300 mb-1">Hora</label>
              <input id="ev-time" type="time" required value="19:00" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
            </div>
          </div>
          <div>
            <label class="block text-zinc-300 mb-1">Categoría</label>
            <select id="ev-cat" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white">
              <option value="Ensayo">Ensayo</option>
              <option value="Fecha en Vivo">Fecha en Vivo</option>
              <option value="Entrega Máster">Entrega Máster</option>
              <option value="Contenido">Publicación de Contenido</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-300 mb-1">Lugar o Plataforma</label>
            <input id="ev-loc" required placeholder="Ej. Sala 3 / Instagram Reels" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-scOrange text-white font-bold">
            Agregar a la Agenda
          </button>
        </form>
      `);
    }

    function submitNewEvent(e) {
      e.preventDefault();
      state.events.push({
        id: 'ev_' + Date.now(),
        title: document.getElementById('ev-title').value.trim(),
        date: document.getElementById('ev-date').value,
        time: document.getElementById('ev-time').value,
        category: document.getElementById('ev-cat').value,
        location: document.getElementById('ev-loc').value.trim()
      });
      saveState();
      renderAgendaTab();
      closeModal();
      showToast('📅 Evento guardado');
    }

    function openAddSetlistModal() {
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="font-serif text-xl font-bold text-white">Agregar al Setlist</h3>
          <button onclick="closeModal()" class="text-zinc-400 hover:text-white">✕</button>
        </div>
        <form onsubmit="submitNewSetlistSong(event)" class="space-y-3 text-xs">
          <div>
            <label class="block text-zinc-300 mb-1">Canción</label>
            <input id="set-title" required placeholder="Ej. Horizonte Violeta" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-zinc-300 mb-1">Duración</label>
              <input id="set-dur" required value="03:50" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
            </div>
            <div>
              <label class="block text-zinc-300 mb-1">Afinación</label>
              <input id="set-tun" required value="Estándar (E)" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
            </div>
          </div>
          <div>
            <label class="block text-zinc-300 mb-1">Pedales / Notas técnicas</label>
            <input id="set-gear" required placeholder="Ej. Chorus + Delay largo + Fuzz en puente" class="w-full bg-void border border-white/15 rounded-xl px-3 py-2 text-white" />
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-scOrange text-white font-bold">
            Añadir al Repertorio
          </button>
        </form>
      `);
    }

    function submitNewSetlistSong(e) {
      e.preventDefault();
      state.setlist.push({
        id: 's_' + Date.now(),
        title: document.getElementById('set-title').value.trim(),
        duration: document.getElementById('set-dur').value.trim(),
        tuning: document.getElementById('set-tun').value.trim(),
        gear: document.getElementById('set-gear').value.trim()
      });
      saveState();
      renderAgendaTab();
      closeModal();
      showToast('🎸 Canción agregada al setlist');
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('📋 Copiado al portapapeles');
      } catch (err) {
        showToast('No se pudo copiar automáticamente');
      }
      document.body.removeChild(textarea);
    }

    window.addEventListener('DOMContentLoaded', () => {
      state.isPlaying = false;
      updateHeaderBandInfo();
      renderPlayer();
      switchTab(state.activeTab || 'radar');

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
